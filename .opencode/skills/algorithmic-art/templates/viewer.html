<!DOCTYPE html>
<!--
  Optional local-browser starter for generative art.
  If CDN access is blocked, swap the p5 script tag for a vendored copy or port
  the sketch to Canvas API using the same UI and seed controls.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generative Art Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(10, 15, 31, 0.9);
      --surface: rgba(19, 28, 53, 0.88);
      --border: rgba(148, 163, 184, 0.25);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #f97316;
      --accent-3: #a78bfa;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), transparent 30%),
        radial-gradient(circle at bottom right, rgba(249, 115, 22, 0.12), transparent 28%),
        var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      padding: 24px;
    }

    .sidebar, .stage {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .sidebar { padding: 24px; }
    .stage {
      padding: 24px;
      display: grid;
      align-content: start;
      gap: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle, .caption {
      color: var(--muted);
      line-height: 1.5;
    }

    .section { margin-top: 28px; }
    .section h2 {
      margin: 0 0 12px;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .seed-display {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      font-family: Consolas, monospace;
      margin-bottom: 10px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button, input[type="number"] {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }

    button {
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(30, 41, 59, 0.95);
    }

    .jump-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 10px;
    }

    .control-group { margin-bottom: 18px; }
    .control-group label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .control-group span { color: var(--muted); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    #canvas-frame {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.92));
      border: 1px solid var(--border);
    }

    canvas {
      max-width: 100%;
      height: auto !important;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 1100px) {
      .page { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="sidebar">
      <h1>Signal Bloom</h1>
      <p class="subtitle">A seeded starter sketch for local experimentation. Replace the title, palette, and drawing logic to match your own movement.</p>

      <section class="section">
        <h2>Seed</h2>
        <div class="seed-display" id="seed-display"></div>
        <div class="button-grid">
          <button type="button" onclick="stepSeed(-1)">Previous</button>
          <button type="button" onclick="stepSeed(1)">Next</button>
          <button type="button" onclick="randomizeSeed()">Random</button>
          <button type="button" onclick="regenerate()">Regenerate</button>
        </div>
        <div class="jump-row">
          <input type="number" id="jump-seed" min="1" step="1" placeholder="Jump to seed">
          <button type="button" onclick="jumpToSeed()">Go</button>
        </div>
      </section>

      <section class="section">
        <h2>Parameters</h2>
        <div class="control-group">
          <label for="density">Density <span id="density-value"></span></label>
          <input type="range" id="density" min="0.2" max="1" step="0.01" value="0.55" oninput="updateParameter('density', this.value, 2)">
        </div>
        <div class="control-group">
          <label for="drift">Drift <span id="drift-value"></span></label>
          <input type="range" id="drift" min="0.2" max="1.4" step="0.01" value="0.72" oninput="updateParameter('drift', this.value, 2)">
        </div>
        <div class="control-group">
          <label for="scale">Field scale <span id="scale-value"></span></label>
          <input type="range" id="scale" min="0.004" max="0.04" step="0.001" value="0.014" oninput="updateParameter('scale', this.value, 3)">
        </div>
      </section>

      <section class="section">
        <h2>Actions</h2>
        <div class="button-grid">
          <button type="button" onclick="resetControls()">Reset</button>
          <button type="button" onclick="downloadPng()">Download PNG</button>
        </div>
      </section>
    </aside>

    <main class="stage">
      <div id="canvas-frame">
        <div id="canvas-container"></div>
      </div>
      <p class="caption">This starter stays in a single HTML file so it can travel easily between repos and local previews.</p>
    </main>
  </div>

  <script>
    const defaults = {
      seed: 12345,
      density: 0.55,
      drift: 0.72,
      scale: 0.014
    };

    let params = { ...defaults };

    function syncUi() {
      document.getElementById('seed-display').textContent = `Seed ${params.seed}`;
      document.getElementById('jump-seed').value = params.seed;
      for (const [name, digits] of [['density', 2], ['drift', 2], ['scale', 3]]) {
        document.getElementById(name).value = params[name];
        document.getElementById(`${name}-value`).textContent = Number(params[name]).toFixed(digits);
      }
    }

    function setSeed(nextSeed) {
      params.seed = Math.max(1, Math.floor(Number(nextSeed) || 1));
      randomSeed(params.seed);
      noiseSeed(params.seed);
      syncUi();
    }

    function stepSeed(delta) {
      setSeed(params.seed + delta);
      redraw();
    }

    function randomizeSeed() {
      setSeed(Math.floor(Math.random() * 999999) + 1);
      redraw();
    }

    function jumpToSeed() {
      setSeed(document.getElementById('jump-seed').value);
      redraw();
    }

    function regenerate() {
      setSeed(params.seed);
      redraw();
    }

    function resetControls() {
      params = { ...defaults };
      setSeed(params.seed);
      redraw();
    }

    function updateParameter(name, value, digits) {
      params[name] = Number(value);
      document.getElementById(`${name}-value`).textContent = Number(value).toFixed(digits);
      redraw();
    }

    function setup() {
      const canvas = createCanvas(920, 920);
      canvas.parent('canvas-container');
      pixelDensity(2);
      noLoop();
      syncUi();
    }

    function draw() {
      background('#050816');
      setSeed(params.seed);
      translate(width / 2, height / 2);
      strokeWeight(1.15);
      noFill();

      const loops = Math.floor(900 + params.density * 1600);
      const cool = color('#38bdf8');
      const warm = color('#f97316');
      const bloom = color('#a78bfa');

      for (let i = 0; i < loops; i += 1) {
        const angle = map(i, 0, loops, 0, TWO_PI * 18);
        const radius = 18 + i * 0.22;
        const wobble = noise(i * params.scale, params.seed * 0.0004) * params.drift * 240;
        const x = cos(angle) * (radius + wobble);
        const y = sin(angle * 1.05) * (radius - wobble * 0.35);
        const t = noise(i * 0.003, params.seed * 0.001);
        stroke(lerpColor(cool, warm, t));
        point(x, y);
        if (i % 3 === 0) {
          stroke(red(bloom), green(bloom), blue(bloom), 48);
          line(x, y, x * 0.92, y * 0.92);
        }
      }
    }

    function downloadPng() {
      saveCanvas(`generative-art-${params.seed}`, 'png');
    }
  </script>
</body>
</html>
