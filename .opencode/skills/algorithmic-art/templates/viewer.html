<!DOCTYPE html>
<!--
    Use this file as the starting point for local generative-art viewers.

    Keep:
    ✓ Overall layout (header, sidebar, main content)
    ✓ Seed navigation, parameter controls, and action buttons
    ✓ Single-file delivery with the UI and JS inline

    Customize:
    ✗ Title, subtitle, and parameter list
    ✗ Color controls (keep, remove, or expand them as needed)
    ✗ The generative algorithm and rendering logic

    Replace the demo algorithm with something original for the request.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        :root {
            --ui-bg: #f4f4ef;
            --panel-bg: rgba(255, 255, 255, 0.96);
            --text: #171717;
            --muted: #6b7280;
            --border: #d6dae1;
            --accent: #2563eb;
            --accent-strong: #1d4ed8;
            --accent-alt: #0f766e;
            --accent-soft: #d97706;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #ffffff 0%, var(--ui-bg) 56%, #eaede5 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 340px;
            flex-shrink: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 18px 36px rgba(23, 23, 23, 0.12);
            border: 1px solid rgba(214, 218, 225, 0.85);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .control-section {
            margin-bottom: 28px;
        }

        .control-section h3 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent);
        }

        .seed-input {
            width: 100%;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            text-align: center;
            color: var(--text);
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.14);
            background: #ffffff;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .control-group,
        .color-group {
            margin-bottom: 18px;
        }

        .control-group label,
        .color-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .slider-container,
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 5px;
            background: #e5e7eb;
            border-radius: 999px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        .value-display,
        .color-value {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 12px;
            color: var(--muted);
            min-width: 74px;
            text-align: right;
        }

        .color-picker-container input[type="color"] {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            width: 100%;
        }

        .button:hover {
            background: var(--accent-strong);
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.18);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--accent-alt);
        }

        .button.secondary:hover {
            background: #0b5f56;
        }

        .button.tertiary {
            background: var(--accent-soft);
        }

        .button.tertiary:hover {
            background: #b45309;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .compact-row {
            margin-top: 8px;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 48px rgba(23, 23, 23, 0.12);
            background: #ffffff;
            border: 1px solid rgba(214, 218, 225, 0.85);
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            font-size: 17px;
            color: var(--muted);
        }

        @media (max-width: 960px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>Contour Drift</h1>
            <div class="subtitle">Replace this demo copy with a title and description that match the requested generative system.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" min="1" value="12345" onchange="applySeedInput()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <div class="button-row compact-row">
                    <button class="button secondary" onclick="applySeedInput()">Go</button>
                    <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
                </div>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="800" max="7000" step="200" value="3400" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3400</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.15" max="1.5" step="0.05" value="0.55" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">0.55</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.001" max="0.02" step="0.0005" value="0.0045" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.0045</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="2" max="20" step="1" value="8" oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">8</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Fade Amount</label>
                    <div class="slider-container">
                        <input type="range" id="fadeAlpha" min="4" max="40" step="1" value="18" oninput="updateParam('fadeAlpha', this.value)">
                        <span class="value-display" id="fadeAlpha-value">18</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>

                <div class="color-group">
                    <label>Primary Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#2563eb" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#2563eb</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Secondary Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#0f766e" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#0f766e</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Accent Color</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#f59e0b" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#f59e0b</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Background Tone</label>
                    <div class="color-picker-container">
                        <input type="color" id="background" value="#f8f7f2" onchange="updateBackground(this.value)">
                        <span class="color-value" id="background-value">#f8f7f2</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="regenerate()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row compact-row">
                    <button class="button tertiary" onclick="downloadPng()">Download PNG</button>
                </div>
            </div>
        </aside>

        <main class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing local generative viewer...</div>
            </div>
        </main>
    </div>

    <script>
        const integerParams = new Set(['particleCount', 'trailLength', 'fadeAlpha']);

        const defaultParams = {
            seed: 12345,
            particleCount: 3400,
            flowSpeed: 0.55,
            noiseScale: 0.0045,
            trailLength: 8,
            fadeAlpha: 18,
            background: '#f8f7f2',
            colorPalette: ['#2563eb', '#0f766e', '#f59e0b']
        };

        function cloneDefaultParams() {
            return {
                ...defaultParams,
                colorPalette: [...defaultParams.colorPalette]
            };
        }

        let params = cloneDefaultParams();
        let particles = [];
        const canvasSize = 1200;

        function setup() {
            const canvas = createCanvas(canvasSize, canvasSize);
            canvas.parent('canvas-container');
            pixelDensity(1);
            frameRate(60);
            initializeSystem();

            const loading = document.querySelector('.loading');
            if (loading) {
                loading.style.display = 'none';
            }
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            particles = Array.from({ length: params.particleCount }, () => new Particle());
            const [r, g, b] = colorFromHex(params.background);
            background(r, g, b);
        }

        function draw() {
            const [bgR, bgG, bgB] = colorFromHex(params.background);
            noStroke();
            fill(bgR, bgG, bgB, params.fadeAlpha);
            rect(0, 0, width, height);

            for (const particle of particles) {
                particle.update();
                particle.display();
            }
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(isInitial = false) {
                this.pos = createVector(random(width), random(height));
                this.prev = this.pos.copy();
                this.stepScale = random(0.75, 1.35);
                this.life = floor(random(140, 420));
                this.maxLife = this.life;
                if (!isInitial) {
                    this.prev = this.pos.copy();
                }
            }

            update() {
                this.prev = this.pos.copy();
                const fieldAngle = noise(
                    this.pos.x * params.noiseScale,
                    this.pos.y * params.noiseScale,
                    frameCount * 0.002
                ) * TAU * 3.0;
                const drift = p5.Vector.fromAngle(fieldAngle).mult(params.flowSpeed * this.stepScale * 2.2);
                this.pos.add(drift);
                this.life -= 1;

                const outOfBounds = (
                    this.pos.x < -10 ||
                    this.pos.x > width + 10 ||
                    this.pos.y < -10 ||
                    this.pos.y > height + 10
                );

                if (outOfBounds || this.life <= 0) {
                    this.reset();
                }
            }

            display() {
                const progress = 1 - this.life / this.maxLife;
                const paletteIndex = Math.min(
                    params.colorPalette.length - 1,
                    Math.floor(progress * params.colorPalette.length)
                );
                const [r, g, b] = colorFromHex(params.colorPalette[paletteIndex]);
                stroke(r, g, b, 70 + progress * 110);
                strokeWeight(map(params.trailLength, 2, 20, 0.6, 2.4));
                line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
            }
        }

        function updateParam(paramName, value) {
            const numericValue = integerParams.has(paramName)
                ? parseInt(value, 10)
                : parseFloat(value);
            params[paramName] = numericValue;
            document.getElementById(`${paramName}-value`).textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            const index = parseInt(colorId.replace('color', ''), 10) - 1;
            params.colorPalette[index] = value;
            document.getElementById(`${colorId}-value`).textContent = value;
            initializeSystem();
        }

        function updateBackground(value) {
            params.background = value;
            document.getElementById('background-value').textContent = value;
            initializeSystem();
        }

        function regenerate() {
            initializeSystem();
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function applySeedInput() {
            const input = document.getElementById('seed-input');
            const newSeed = parseInt(input.value, 10);
            if (Number.isFinite(newSeed) && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed += 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = cloneDefaultParams();
            syncUiFromParams();
            initializeSystem();
        }

        function downloadPng() {
            saveCanvas(`generative-art-${params.seed}`, 'png');
        }

        function syncUiFromParams() {
            updateSeedDisplay();
            const sliderFields = ['particleCount', 'flowSpeed', 'noiseScale', 'trailLength', 'fadeAlpha'];
            for (const field of sliderFields) {
                document.getElementById(field).value = params[field];
                document.getElementById(`${field}-value`).textContent = params[field];
            }

            params.colorPalette.forEach((value, index) => {
                const colorId = `color${index + 1}`;
                document.getElementById(colorId).value = value;
                document.getElementById(`${colorId}-value`).textContent = value;
            });

            document.getElementById('background').value = params.background;
            document.getElementById('background-value').textContent = params.background;
        }

        function colorFromHex(hex) {
            const value = hex.replace('#', '');
            return [0, 2, 4].map((index) => parseInt(value.slice(index, index + 2), 16));
        }

        window.addEventListener('load', syncUiFromParams);
    </script>
</body>
</html>
